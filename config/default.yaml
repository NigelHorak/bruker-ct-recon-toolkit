# Full adjustable defaults for Bruker TIFF + .log reconstruction.
# The GUI loads this file; presets override sections of it.

ring:
  enable: true
  # remove_all_stripe | remove_stripe_based_sorting | remove_large_stripe | remove_dead_stripe | none
  method: remove_all_stripe
  # Higher snr = less sensitive (fewer stripes detected)
  snr: 3.0
  # Odd window sizes for median filters
  la_size: 51
  sm_size: 21
  drop_ratio: 0.1
  dim: 1

recon:
  # FBP = fast slice-wise | FDK = cone-beam (uses SOD/SDD from .log)
  recon_type: FBP
  # Used when recon_type is FBP: FBP_CUDA | SIRT_CUDA | SART_CUDA | CGLS_CUDA | FBP | ...
  method: FBP_CUDA
  filter_name: hann
  apply_log: true
  # Used by iterative methods (SIRT/SART/CGLS)
  num_iter: 100
  chunk_size: 32
  # auto | manual base COR; pixel_shift is NRecon-style postalignment nudge
  center_mode: auto
  center: null
  pixel_shift: 0.0

preview:
  # null = middle detector row
  row: null

io:
  save_preview: true

paths:
  # Empty = auto folder next to the scan
  output_dir: ""
